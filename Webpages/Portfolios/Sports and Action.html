<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports & Action — Joseph Lodato Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Webpages/Portfolios/portfolio.css">
</head>

<body>

  <!-- ── NAV ── -->
  <nav class="navbar">
    <a href="/Webpages/portfolioHome.html" class="nav-brand">Joseph Lodato Photography</a>
    <div class="nav-right">
      <a href="/index.html">Main Site</a>

      <div class="dropdown">
        <button class="dropbtn">
          Gallery
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="dropdown-content">
          <a href="/Webpages/Portfolios/Astrophotography.html">Astrophotography</a>
          <a href="/Webpages/Portfolios/Sports and Action.html" class="active">Sports &amp; Action</a>
          <a href="/Webpages/Portfolios/landscapes and Animals.html">Landscapes &amp; Wildlife</a>
        </div>
      </div>

      <a href="mailto:jalodato@syr.edu">Contact</a>
    </div>
  </nav>

  <!-- ── PAGE HEADER ── -->
  <div class="gallery-header">
    <div class="gallery-header-left">
      <div class="gallery-eyebrow">Collection 03</div>
      <h1 class="gallery-title">Sports &amp; Action</h1>
      <div class="gallery-count" id="photo-count"></div>
    </div>
    <a href="/Webpages/portfolioHome.html" class="gallery-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      All Collections
    </a>
  </div>
  <div class="header-divider"></div>

  <!-- ── MASONRY GRID (filled in automatically by gallery-loader.js) ── -->
  <div class="gallery">
    <div class="grid-wrapper" id="grid"></div>
  </div>

  <!-- ── LIGHTBOX ── -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <button class="modal-prev" id="modal-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="modal-next" id="modal-next" aria-label="Next">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="modal-inner">
      <img id="modal-img" src="" alt="">
      <div class="modal-caption" id="modal-caption"></div>
      <div class="modal-counter" id="modal-counter"></div>
    </div>
  </div>

  <footer>
    <p>Copyright &copy; 2024 Joseph Lodato. All rights reserved</p>
  </footer>

  <!-- Must come after #grid and #modal above so the script can find them -->
  <script src="gallery-loader.js"></script>

</body>
</html>
